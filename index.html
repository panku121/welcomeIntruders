<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Royal Intruders | Welcome Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <!-- Logo -->
        <img src="https://panku121.github.io/welcomeIntruders/RoyalIntrudersNewLogo.png" alt="Royal Intruders Logo"
            class="logo">

        <h2>Royal Intruders Player Form</h2>

        <form id="playerForm">
            <label>Player Name</label>
            <input type="text" id="playerName" required>

            <label>Mobile Number</label>
            <input type="number" id="mobileNumber" required>

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Player Role in Team</label>
            <select id="playerRole">
                <option value="">Select Role</option>
                <option>Opener Batsman ( Strike rate Should be Above 125 )</option>
                <option>2nd 3rd Down Batsman</option>
                <option>Middle Order Batsman</option>
                <option>Lower Order Batsman</option>
                <option>Allrounder</option>
                <option>Pace Bowler</option>
                <option>Spin Bowler</option>
                <option>Wicket Keeper Batsman</option>
                <option>Corporate player</option>
                <option>Cricket Lover</option>
            </select>

            <label>T-Shirt Details</label>
            <div class="row">
                <div class="field">
                    <select id="teeSize" required>
                        <option value="">Size</option>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                        <option>XL</option>
                        <option>2XL</option>
                        <option>3XL</option>
                        <option>4XL</option>
                    </select>
                </div>

                <div class="field">
                    <select id="sleeveLength" required>
                        <option value="">Sleeve</option>
                        <option>Half Sleeve</option>
                        <option>Full Sleeve</option>
                    </select>
                </div>
            </div>


            <label>T-Shirt Chest / Back Number</label>
            <input type="number" id="TeeNumber" required>

            <label>Upload your photo</label>
            <input type="file" id="playerPhoto" accept="image/*">
            <div class="photo-preview-wrap" id="photoPreviewWrap">
                <img id="playerPhotoPreview" class="photo-preview" src="" alt="Your photo">
            </div>

            <button type="submit">Submit Details</button>
        </form>

        <!-- Loader -->
        <div class="loader" id="loader"></div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage"></div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { Client, Storage, ID, Permission, Role } from 'https://esm.sh/appwrite@14.0.1';
        import { firebaseConfig } from './firebase-config.js';
        import { appwriteConfig } from './appwrite-config.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Initialize Appwrite
        const client = new Client();
        client
            .setEndpoint(appwriteConfig.endpoint)
            .setProject(appwriteConfig.projectId);
        const storage = new Storage(client);

        // 3. UI Elements
        const form = document.getElementById("playerForm");
        const loader = document.getElementById("loader");
        const successMessage = document.getElementById("successMessage");
        const playerPhotoInput = document.getElementById("playerPhoto");
        const photoPreviewWrap = document.getElementById("photoPreviewWrap");
        const playerPhotoPreview = document.getElementById("playerPhotoPreview");

        // Photo preview: show image when user selects a file (phone or laptop)
        playerPhotoInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file && file.type.startsWith("image/")) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    playerPhotoPreview.src = e.target.result;
                    photoPreviewWrap.classList.add("visible");
                };
                reader.readAsDataURL(file);
            } else {
                playerPhotoPreview.src = "";
                photoPreviewWrap.classList.remove("visible");
            }
        });

        // 4. Form Submit Listener
        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            // Get Form values
            const name = document.getElementById("playerName").value;
            const dob = document.getElementById("dob").value;
            const playerRole = document.getElementById("playerRole").value;
            const teeSize = document.getElementById("teeSize").value;
            const TeeNumber = document.getElementById("TeeNumber").value;
            const sleeveLength = document.getElementById("sleeveLength").value;
            const mobileNumber = document.getElementById("mobileNumber").value;

            // We use Name + DOB as a unique key for checking (since you don't have email in the form)
            // We replace dots or special characters to make it a valid Firebase path
            const userId = `${name}_${mobileNumber}`.replace(/[\.\#\$\[\]]/g, "_");
            const userRef = ref(db, 'players/' + userId);

            loader.style.display = "block";
            successMessage.style.display = "none";

            try {
                // Check if player already exists
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    loader.style.display = "none";
                    alert("This player (Name + DOB) is already registered!");
                    console.log("User already exists:", snapshot.val());
                } else {
                    // Upload photo to Appwrite Storage (if user selected one)
                    let photoURL = null;
                    const photoFile = playerPhotoInput.files[0];
                    if (photoFile && photoFile.type.startsWith("image/")) {
                        const promise = storage.createFile(
                            appwriteConfig.bucketId, 
                            ID.unique(), 
                            photoFile,
                            [Permission.read(Role.any())]
                        );
                        const response = await promise;
                        photoURL = `https://cloud.appwrite.io/v1/storage/buckets/${appwriteConfig.bucketId}/files/${response.$id}/view?project=${appwriteConfig.projectId}`
                    }

                    // Save new entry (including photo URL in Realtime Database)
                    await set(userRef, {
                        playerName: name,
                        playerRole: playerRole,
                        dateOfBirth: dob,
                        tShirtSize: teeSize,
                        tShirtNumber: TeeNumber,
                        sleeveLength: sleeveLength,
                        phoneNumber: mobileNumber,
                        photoURL: photoURL,
                        timestamp: new Date().toISOString()
                    });

                    loader.style.display = "none";
                    successMessage.innerHTML = `
            <strong>${name}</strong>,<br>
            Aapka naam, Date of Birth (<strong>${dob}</strong>)  
            Mobile Number <strong>${mobileNumber}</strong> ke saath  
            safely save kar liya gaya hai ✅
        `;
                    successMessage.style.display = "block";
                    form.reset();
                    playerPhotoPreview.src = "";
                    photoPreviewWrap.classList.remove("visible");
                    // ✅ Redirect after success
                    setTimeout(() => {
                        redirectTomainSite();
                    }, 3000);
                }
            } catch (error) {
                loader.style.display = "none";
                console.error("Appwrite/Firebase Error:", error);
                alert("Error saving data. Check console.");
            }

            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.style.display = "none";
            }, 7000);
        });

        function redirectTomainSite() { window.location.href = 'https://panku121.github.io/intrudersOfficialSite' }

    </script>

</body>

</html>
