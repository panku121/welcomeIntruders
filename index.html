<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Royal Intruders - T-Shirt Details</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #111827, #1f2933);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .card {
            background: #ffffff;
            color: #000;
            width: 380px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 120px;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 20px;
            color: #b91c1c;
        }

        label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin: 10px 0 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .field {
            flex: 1;
        }


        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #b91c1c;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #991b1b;
        }

        /* Loader */
        .loader {
            display: none;
            margin: 20px auto;
            border: 6px solid #e5e7eb;
            border-top: 6px solid #b91c1c;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .success-message {
            display: none;
            margin-top: 15px;
            background: #ecfdf5;
            color: #065f46;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Logo -->
        <img src="/RoyalIntrudersNewLogo.png" alt="Royal Intruders Logo" class="logo">

        <h2>Royal Intruders Player Form</h2>

        <form id="playerForm">
            <label>Player Name</label>
            <input type="text" id="playerName" required>

            <label>Mobile Number</label>
            <input type="number" id="mobileNumber" required>

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Player Role in Team</label>
            <select id="playerRole">
                <option value="">Select Role</option>
                <option>Opener Batsman ( Strike rate Should be Above 125 )</option>
                <option>2nd 3rd Down Batsman</option>
                <option>Middle Order Batsman</option>
                <option>Lower Order Batsman</option>
                <option>Allrounder</option>
                <option>Pace Bowler</option>
                <option>Spin Bowler</option>
                <option>Wicket Keeper Batsman</option>
                <option>Corporate player</option>
                <option>Cricket Lover</option>
            </select>

            <label>T-Shirt Details</label>
            <div class="row">
                <div class="field">
                    <select id="teeSize" required>
                        <option value="">Size</option>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                        <option>XL</option>
                        <option>2XL</option>
                        <option>3XL</option>
                    </select>
                </div>

                <div class="field">
                    <select id="sleeveLength" required>
                        <option value="">Sleeve</option>
                        <option>Half Sleeve</option>
                        <option>Full Sleeve</option>
                    </select>
                </div>
            </div>


            <label>T-Shirt Chest / Back Number</label>
            <input type="number" id="TeeNumber" required>

            <button type="submit">Submit Details</button>
        </form>

        <!-- Loader -->
        <div class="loader" id="loader"></div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage"></div>

    </div>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyBd9xnnYBc0teWch8KinC8ku1noBkGPpm0",
            authDomain: "royalintruders.firebaseapp.com",
            projectId: "royalintruders",
            storageBucket: "royalintruders.firebasestorage.app",
            messagingSenderId: "417773145015",
            appId: "1:417773145015:web:1d7edc6bd7e4318fbbb632",
            measurementId: "G-GJ8GXG4BJW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        console.log("app status", app)

        const db = getDatabase(app);

        // 3. UI Elements
        const form = document.getElementById("playerForm");
        const loader = document.getElementById("loader");
        const successMessage = document.getElementById("successMessage");

        // 4. Form Submit Listener
        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            // Get Form values
            const name = document.getElementById("playerName").value;
            const dob = document.getElementById("dob").value;
            const playerRole = document.getElementById("playerRole").value;
            const teeSize = document.getElementById("teeSize").value;
            const TeeNumber = document.getElementById("TeeNumber").value;
            const sleeveLength = document.getElementById("sleeveLength").value;
            const mobileNumber = document.getElementById("mobileNumber").value;

            // We use Name + DOB as a unique key for checking (since you don't have email in the form)
            // We replace dots or special characters to make it a valid Firebase path
            const userId = `${name}_${mobileNumber}`.replace(/[\.\#\$\[\]]/g, "_");
            const userRef = ref(db, 'players/' + userId);

            loader.style.display = "block";
            successMessage.style.display = "none";

            try {
                // Check if player already exists
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    loader.style.display = "none";
                    alert("This player (Name + DOB) is already registered!");
                    console.log("User already exists:", snapshot.val());
                } else {
                    // Save new entry
                    await set(userRef, {
                        playerName: name,
                        playerRole: playerRole,
                        dateOfBirth: dob,
                        tShirtSize: teeSize,
                        tShirtNumber: TeeNumber,
                        sleeveLength: sleeveLength,
                        phoneNumber: mobileNumber,
                        timestamp: new Date().toISOString()
                    });

                    loader.style.display = "none";
                    successMessage.innerHTML = `
            <strong>${name}</strong>,<br>
            Aapka naam, Date of Birth (<strong>${dob}</strong>)  
            Mobile Number <strong>${mobileNumber}</strong> ke saath  
            safely save kar liya gaya hai ✅
        `;
                    successMessage.style.display = "block";
                    form.reset();
                }
            } catch (error) {
                loader.style.display = "none";
                console.error("Firebase Error:", error);
                alert("Error saving data. Check console.");
            }

            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.style.display = "none";
            }, 7000);
        });


    </script>

</body>

</html>
