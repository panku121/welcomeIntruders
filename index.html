<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Intruders | Welcome Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <!-- Logo -->
        <img src="https://panku121.github.io/welcomeIntruders/RoyalIntrudersNewLogo.png" alt="Royal Intruders Logo"
            class="logo">

        <h2>Royal Intruders Player Form</h2>

        <form id="playerForm">
            <label>Player Name</label>
            <input type="text" id="playerName" required>

            <label>Mobile Number</label>
            <input type="number" id="mobileNumber" required>

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Player Role in Team</label>
            <select id="playerRole">
                <option value="">Select Role</option>
                <option>Opener Batsman ( Strike rate Should be Above 125 )</option>
                <option>2nd 3rd Down Batsman</option>
                <option>Middle Order Batsman</option>
                <option>Lower Order Batsman</option>
                <option>Allrounder</option>
                <option>Pace Bowler</option>
                <option>Spin Bowler</option>
                <option>Wicket Keeper Batsman</option>
                <option>Corporate player</option>
                <option>Cricket Lover</option>
            </select>

            <label>T-Shirt Details</label>
            <div class="row">
                <div class="field">
                    <select id="teeSize" required>
                        <option value="">Size</option>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                        <option>XL</option>
                        <option>2XL</option>
                        <option>3XL</option>
                        <option>4XL</option>
                    </select>
                </div>

                <div class="field">
                    <select id="sleeveLength" required>
                        <option value="">Sleeve</option>
                        <option>Half Sleeve</option>
                        <option>Full Sleeve</option>
                    </select>
                </div>
            </div>


            <label>T-Shirt Chest / Back Number</label>
            <input type="number" id="TeeNumber" required>

            <label>Upload Player Photo ( Upto 20MB )</label>
            <input type="file" id="playerPhoto" accept=".jpg,.jpeg,.png,.webp" required>

            <button type="submit">Submit Details</button>
        </form>

        <!-- Loader -->
        <div class="loader" id="loader"></div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage"></div>

    </div>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBd9xnnYBc0teWch8KinC8ku1noBkGPpm0",
            authDomain: "royalintruders.firebaseapp.com",
            projectId: "royalintruders",
            storageBucket: "royalintruders.firebasestorage.app",
            messagingSenderId: "417773145015",
            appId: "1:417773145015:web:1d7edc6bd7e4318fbbb632",
            measurementId: "G-GJ8GXG4BJW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        const db = getDatabase(app);

        // 3. UI Elements
        const form = document.getElementById("playerForm");
        const loader = document.getElementById("loader");
        const successMessage = document.getElementById("successMessage");
        const playerPhotoInput = document.getElementById("playerPhoto");

        // Cloudinary config: replace with your actual values.
        const cloudinaryConfig = {
            cloudName: "dv1hqflm2",
            uploadPreset: "royalPlayerProfilePic"
        };
        const allowedImageTypes = ["image/jpeg", "image/png", "image/webp"];
        const maxImageSizeInBytes = 20 * 1024 * 1024; // 20MB

        async function uploadToCloudinary(file, userId) {
            const uploadUrl = `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`;
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", cloudinaryConfig.uploadPreset);
            formData.append("folder", "royal-intruders/players");
            formData.append("public_id", userId);

            const response = await fetch(uploadUrl, {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData?.error?.message || "Cloudinary upload failed");
            }

            return response.json();
        }

        // 4. Form Submit Listener
        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            // Get Form values
            const name = document.getElementById("playerName").value;
            const dob = document.getElementById("dob").value;
            const playerRole = document.getElementById("playerRole").value;
            const teeSize = document.getElementById("teeSize").value;
            const TeeNumber = document.getElementById("TeeNumber").value;
            const sleeveLength = document.getElementById("sleeveLength").value;
            const mobileNumber = document.getElementById("mobileNumber").value;
            const photoFile = playerPhotoInput.files[0];

            // We use Name + DOB as a unique key for checking (since you don't have email in the form)
            // We replace dots or special characters to make it a valid Firebase path
            const userId = `${name}_${mobileNumber}`.replace(/[\.\#\$\[\]]/g, "_");
            const userRef = ref(db, 'players/' + userId);

            loader.style.display = "block";
            successMessage.style.display = "none";

            try {
                if (cloudinaryConfig.cloudName === "YOUR_CLOUD_NAME" || cloudinaryConfig.uploadPreset === "YOUR_UNSIGNED_UPLOAD_PRESET") {
                    throw new Error("Cloudinary config not set. Please add cloudName and uploadPreset.");
                }

                if (!photoFile) {
                    throw new Error("Please select a player photo.");
                }

                if (!allowedImageTypes.includes(photoFile.type)) {
                    throw new Error("Only JPG, PNG, or WEBP image files are allowed.");
                }

                if (photoFile.size > maxImageSizeInBytes) {
                    throw new Error("Image size must be 20MB or less.");
                }

                // Check if player already exists
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    loader.style.display = "none";
                    alert("This player (Name + DOB) is already registered!");
                    console.log("User already exists:", snapshot.val());
                } else {
                    const cloudinaryResult = await uploadToCloudinary(photoFile, userId);

                    // Save new entry
                    await set(userRef, {
                        playerName: name,
                        playerRole: playerRole,
                        dateOfBirth: dob,
                        tShirtSize: teeSize,
                        tShirtNumber: TeeNumber,
                        sleeveLength: sleeveLength,
                        phoneNumber: mobileNumber,
                        profileImage: cloudinaryResult.secure_url,
                        cloudinaryPublicId: cloudinaryResult.public_id,
                        isPlayerInactive: false,
                        timestamp: new Date().toISOString()
                    });

                    loader.style.display = "none";
                    successMessage.innerHTML = `
            <strong>${name}</strong>,<br>
            Aapka naam, Date of Birth (<strong>${dob}</strong>)  
            Mobile Number <strong>${mobileNumber}</strong> ke saath  
            safely save kar liya gaya hai ✅
        `;
                    successMessage.style.display = "block";
                    form.reset();
                    // ✅ Redirect after success
                    setTimeout(() => {
                        redirectTomainSite();
                    }, 3000);
                }
            } catch (error) {
                loader.style.display = "none";
                console.error("Firebase Error:", error);
                alert(error.message || "Error saving data. Check console.");
            }

            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.style.display = "none";
            }, 7000);
        });

        function redirectTomainSite() { window.location.href = 'https://royalintruders.lovable.app' }

    </script>

</body>

</html>
